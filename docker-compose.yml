services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Code runs in a subprocess INSIDE this container. The container itself is the isolation boundary.
      SANDBOX: subprocess
    depends_on:
      redis:
        condition: service_healthy
